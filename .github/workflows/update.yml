name: Criar Página de Jogo

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Nome do Jogo/URL (Ex: avakin, free fire, gta 5)'
        required: true
        default: 'avakin'
      foto_url:
        description: 'URL da Foto (Deixe em branco para usar a sua foto oficial)'
        required: false
        default: ''
      texto1:
        description: 'Texto do Botão 1 (Ex: Avakin Life 64bits)'
        required: false
        default: ''
      link1:
        description: 'Link de Download 1'
        required: false
        default: ''
      texto2:
        description: 'Texto do Botão 2 (Ex: Avakin Life 32bits)'
        required: false
        default: ''
      link2:
        description: 'Link de Download 2'
        required: false
        default: ''
      texto3:
        description: 'Texto do Botão 3 (Ex: Arquivo OBB)'
        required: false
        default: ''
      link3:
        description: 'Link de Download 3'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerar Página e Link
        env:
          SLUG: ${{ github.event.inputs.slug }}
          FOTO_URL: ${{ github.event.inputs.foto_url }}
          TEXTO1: ${{ github.event.inputs.texto1 }}
          LINK1: ${{ github.event.inputs.link1 }}
          TEXTO2: ${{ github.event.inputs.texto2 }}
          LINK2: ${{ github.event.inputs.link2 }}
          TEXTO3: ${{ github.event.inputs.texto3 }}
          LINK3: ${{ github.event.inputs.link3 }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: python generate.py

      - name: Salvar no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Adicionando jogo ${{ github.event.inputs.slug }}" || exit 0
          git push
