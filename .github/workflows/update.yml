name: Atualizar Link na Bio

on:
  workflow_dispatch:
    inputs:
      texto1:
        description: 'Texto do Botão 1 (Ex: Avakin Life 64bits)'
        required: false
        default: ''
      link1:
        description: 'Link de Download 1'
        required: false
        default: ''
      texto2:
        description: 'Texto do Botão 2 (Ex: Avakin Life 32bits)'
        required: false
        default: ''
      link2:
        description: 'Link de Download 2'
        required: false
        default: ''
      texto3:
        description: 'Texto do Botão 3 (Ex: OBB / Outro App)'
        required: false
        default: ''
      link3:
        description: 'Link de Download 3'
        required: false
        default: ''

# Libera permissão para o robô salvar e atualizar o site
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerar nova página index.html
        env:
          TEXTO1: ${{ github.event.inputs.texto1 }}
          LINK1: ${{ github.event.inputs.link1 }}
          TEXTO2: ${{ github.event.inputs.texto2 }}
          LINK2: ${{ github.event.inputs.link2 }}
          TEXTO3: ${{ github.event.inputs.texto3 }}
          LINK3: ${{ github.event.inputs.link3 }}
        run: python generate.py

      - name: Salvar e Publicar alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualizando página de downloads" || exit 0
          git push

      - name: Gerar Link para Copiar
        run: |
          echo "### 🚀 SEU SITE FOI ATUALIZADO!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **Clique aqui para ver seu site:** [https://kennedymorgy.github.io/api-downloads/](https://kennedymorgy.github.io/api-downloads/)" >> $GITHUB_STEP_SUMMARY
