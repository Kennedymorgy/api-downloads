name: Criar/Atualizar Página de Jogo

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Nome da URL do Jogo (Ex: avakin, freefire, gta5). Sem espaço!'
        required: true
        default: 'avakin'
      foto_url:
        description: 'URL da Foto da Capa / Perfil (Opcional)'
        required: false
        default: ''
      texto1:
        description: 'Texto do Botão 1 (Ex: Avakin Life 64bits)'
        required: false
        default: ''
      link1:
        description: 'Link de Download 1'
        required: false
        default: ''
      texto2:
        description: 'Texto do Botão 2 (Ex: Avakin Life 32bits)'
        required: false
        default: ''
      link2:
        description: 'Link de Download 2'
        required: false
        default: ''
      texto3:
        description: 'Texto do Botão 3 (Ex: OBB / Outro App)'
        required: false
        default: ''
      link3:
        description: 'Link de Download 3'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerar nova página HTML
        env:
          SLUG: ${{ github.event.inputs.slug }}
          FOTO_URL: ${{ github.event.inputs.foto_url }}
          TEXTO1: ${{ github.event.inputs.texto1 }}
          LINK1: ${{ github.event.inputs.link1 }}
          TEXTO2: ${{ github.event.inputs.texto2 }}
          LINK2: ${{ github.event.inputs.link2 }}
          TEXTO3: ${{ github.event.inputs.texto3 }}
          LINK3: ${{ github.event.inputs.link3 }}
        run: python generate.py

      - name: Salvar e Publicar alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Adicionando jogo ${{ github.event.inputs.slug }}" || exit 0
          git push

      - name: Gerar Link Exclusivo para Copiar
        run: |
          SLUG_NAME="${{ github.event.inputs.slug }}"
          echo "### 🚀 PÁGINA DO JOGO CRIADA COM SUCESSO!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **LINK EXCLUSIVO DO SEU JOGO:**" >> $GITHUB_STEP_SUMMARY
          echo "[https://kennedymorgy.github.io/api-downloads/${SLUG_NAME}.html](https://kennedymorgy.github.io/api-downloads/${SLUG_NAME}.html)" >> $GITHUB_STEP_SUMMARY
